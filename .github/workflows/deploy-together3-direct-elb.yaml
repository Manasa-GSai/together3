# ═══════════════════════════════════════════════════════════════════════════════
# DEPLOY TOGETHER3 - Direct ELB Mode (Bypassing NGINX Ingress)
# App: together3 | Tenant: opseratest | Region: us-east-1 | Env: dev
# Generated by Opsera Code-to-Cloud Enterprise v1.7.3
#
# This workflow creates a dedicated AWS NLB directly attached to application pods
# ═══════════════════════════════════════════════════════════════════════════════

name: "🚀 together3: Deploy Direct ELB"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm deployment'
        type: boolean
        default: false
        required: true

env:
  APP_NAME: together3
  TENANT: opseratest
  AWS_REGION: us-east-1
  EKS_CLUSTER: opseratest-use1-np
  NAMESPACE: opseratest-together3-dev
  ENVIRONMENT: dev

permissions:
  contents: write
  id-token: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # PREREQUISITES CHECK
  # ═══════════════════════════════════════════════════════════════════════════════
  check-prerequisites:
    name: "🔍 Check Prerequisites"
    runs-on: ubuntu-latest
    if: inputs.confirm == true
    outputs:
      aws_account_id: ${{ steps.account.outputs.account_id }}
      ecr_uri: ${{ steps.ecr.outputs.ecr_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "✅ AWS Account: $ACCOUNT_ID"

      - name: Check/Create ECR Repository
        id: ecr
        run: |
          ACCOUNT_ID="${{ steps.account.outputs.account_id }}"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO_NAME="${{ env.TENANT }}/${{ env.APP_NAME }}"
          
          # Check if repo exists, create if not
          if ! aws ecr describe-repositories --repository-names "$REPO_NAME" 2>/dev/null; then
            echo "Creating ECR repository: $REPO_NAME"
            aws ecr create-repository --repository-name "$REPO_NAME" --image-scanning-configuration scanOnPush=true
          else
            echo "ECR repository already exists: $REPO_NAME"
          fi
          
          echo "ecr_uri=$ECR_URI" >> $GITHUB_OUTPUT
          echo "✅ ECR URI: $ECR_URI/$REPO_NAME"

      - name: Check EKS Cluster
        run: |
          if aws eks describe-cluster --name ${{ env.EKS_CLUSTER }} 2>/dev/null; then
            echo "✅ EKS Cluster exists: ${{ env.EKS_CLUSTER }}"
          else
            echo "❌ EKS Cluster not found: ${{ env.EKS_CLUSTER }}"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # BUILD AND PUSH
  # ═══════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: "🔨 Build & Push Image"
    runs-on: ubuntu-latest
    needs: [check-prerequisites]
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      full_image: ${{ steps.build.outputs.full_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ needs.check-prerequisites.outputs.ecr_uri }}

      - name: Build and Push
        id: build
        run: |
          ECR_URI="${{ needs.check-prerequisites.outputs.ecr_uri }}"
          REPO_NAME="${{ env.TENANT }}/${{ env.APP_NAME }}"
          IMAGE_TAG="${GITHUB_SHA:0:7}-$(date +%Y%m%d%H%M%S)"
          FULL_IMAGE="${ECR_URI}/${REPO_NAME}:${IMAGE_TAG}"
          
          echo "Building: $FULL_IMAGE"
          docker build -f .opsera-${{ env.APP_NAME }}/Dockerfile -t $FULL_IMAGE .
          docker push $FULL_IMAGE
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $FULL_IMAGE"

  # ═══════════════════════════════════════════════════════════════════════════════
  # UPDATE MANIFESTS
  # ═══════════════════════════════════════════════════════════════════════════════
  update-manifests:
    name: "📝 Update Manifests"
    runs-on: ubuntu-latest
    needs: [check-prerequisites, build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Update Kustomization
        run: |
          ECR_URI="${{ needs.check-prerequisites.outputs.ecr_uri }}"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          REPO_NAME="${{ env.TENANT }}/${{ env.APP_NAME }}"
          
          cd .opsera-${{ env.APP_NAME }}/k8s/overlays/${{ env.ENVIRONMENT }}
          
          # Replace placeholder with actual ECR URI
          sed -i "s|PLACEHOLDER_ECR_URI|${ECR_URI}|g" kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|g" kustomization.yaml
          
          cat kustomization.yaml
          echo "✅ Manifests updated"

      - name: Update ArgoCD Application
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          
          cd .opsera-${{ env.APP_NAME }}/argocd/${{ env.ENVIRONMENT }}
          
          sed -i "s|PLACEHOLDER_REPO_URL|${REPO_URL}|g" application.yaml
          
          cat application.yaml
          echo "✅ ArgoCD application updated"

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .opsera-${{ env.APP_NAME }}/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy ${{ env.APP_NAME }} to ${{ env.ENVIRONMENT }} (Direct ELB)

Image: ${{ needs.build-and-push.outputs.image_tag }}
Mode: Direct ELB (bypassing NGINX Ingress)

[skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # DEPLOY TO EKS
  # ═══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Deploy to EKS"
    runs-on: ubuntu-latest
    needs: [check-prerequisites, build-and-push, update-manifests]
    outputs:
      elb_endpoint: ${{ steps.get-elb.outputs.elb_endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Create Namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace ready: ${{ env.NAMESPACE }}"

      - name: Create ECR Pull Secret
        run: |
          ECR_URI="${{ needs.check-prerequisites.outputs.ecr_uri }}"
          
          # Get ECR token
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          
          # Create docker-registry secret
          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server=${ECR_URI} \
            --docker-username=AWS \
            --docker-password="${ECR_TOKEN}" \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "✅ ECR pull secret created"

      - name: Apply Manifests via Kustomize
        run: |
          kubectl apply -k .opsera-${{ env.APP_NAME }}/k8s/overlays/${{ env.ENVIRONMENT }}/
          echo "✅ Manifests applied"

      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} --timeout=5m
          echo "✅ Deployment ready"

      - name: Wait for ELB Provisioning
        id: get-elb
        run: |
          echo "Waiting for ELB to be provisioned..."
          
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ELB_HOSTNAME=$(kubectl get svc ${{ env.APP_NAME }}-elb -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            
            if [ -n "$ELB_HOSTNAME" ] && [ "$ELB_HOSTNAME" != "null" ]; then
              echo "✅ ELB Ready!"
              echo "elb_endpoint=$ELB_HOSTNAME" >> $GITHUB_OUTPUT
              break
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Waiting for ELB..."
            sleep 10
          done
          
          if [ -z "$ELB_HOSTNAME" ] || [ "$ELB_HOSTNAME" == "null" ]; then
            echo "⚠️ ELB not ready after ${MAX_ATTEMPTS} attempts"
            kubectl get svc ${{ env.APP_NAME }}-elb -n ${{ env.NAMESPACE }} -o yaml
            exit 1
          fi

      - name: Verify ELB Health
        run: |
          ELB_HOSTNAME="${{ steps.get-elb.outputs.elb_endpoint }}"
          
          echo "Testing ELB endpoint: http://${ELB_HOSTNAME}/"
          
          # Wait for DNS propagation
          sleep 30
          
          # Test the endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ELB_HOSTNAME}/" || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ ELB is healthy: HTTP $HTTP_CODE"
          else
            echo "⚠️ ELB returned HTTP $HTTP_CODE (may need more time for DNS)"
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # SETUP ROUTE53 DNS
  # ═══════════════════════════════════════════════════════════════════════════════
  setup-dns:
    name: "🌐 Setup Route53 DNS"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.outputs.elb_endpoint != ''
    outputs:
      dns_record: ${{ steps.create-dns.outputs.dns_record }}
      dns_success: ${{ steps.create-dns.outputs.dns_success }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find Hosted Zone
        id: find-zone
        run: |
          # Find hosted zone for agent.opsera.dev
          ZONE_ID=$(aws route53 list-hosted-zones \
            --query "HostedZones[?Name=='agent.opsera.dev.'].Id" \
            --output text | sed 's|/hostedzone/||')
          
          if [ -z "$ZONE_ID" ]; then
            echo "⚠️ Hosted zone for agent.opsera.dev not found"
            echo "zone_found=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Found hosted zone: $ZONE_ID"
            echo "zone_id=$ZONE_ID" >> $GITHUB_OUTPUT
            echo "zone_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Route53 DNS Record
        id: create-dns
        if: steps.find-zone.outputs.zone_found == 'true'
        run: |
          ZONE_ID="${{ steps.find-zone.outputs.zone_id }}"
          ELB_HOSTNAME="${{ needs.deploy.outputs.elb_endpoint }}"
          DNS_RECORD="${{ env.TENANT }}-${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}.agent.opsera.dev"
          
          echo "Creating DNS record: $DNS_RECORD → $ELB_HOSTNAME"
          
          # Create change batch
          cat > /tmp/dns-change.json << EOF
          {
            "Changes": [{
              "Action": "UPSERT",
              "ResourceRecordSet": {
                "Name": "${DNS_RECORD}",
                "Type": "CNAME",
                "TTL": 300,
                "ResourceRecords": [{"Value": "${ELB_HOSTNAME}"}]
              }
            }]
          }
          EOF
          
          cat /tmp/dns-change.json
          
          # Apply DNS change
          set +e
          CHANGE_OUTPUT=$(aws route53 change-resource-record-sets \
            --hosted-zone-id $ZONE_ID \
            --change-batch file:///tmp/dns-change.json \
            --query 'ChangeInfo.Id' \
            --output text 2>&1)
          DNS_EXIT_CODE=$?
          set -e
          
          if [ $DNS_EXIT_CODE -eq 0 ]; then
            echo "✅ DNS Record Created: $CHANGE_OUTPUT"
            echo "dns_record=$DNS_RECORD" >> $GITHUB_OUTPUT
            echo "dns_success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ DNS creation failed: $CHANGE_OUTPUT"
            echo "dns_record=$DNS_RECORD" >> $GITHUB_OUTPUT
            echo "dns_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for DNS Propagation
        if: steps.create-dns.outputs.dns_success == 'true'
        run: |
          DNS_RECORD="${{ steps.create-dns.outputs.dns_record }}"
          
          echo "Waiting for DNS propagation..."
          
          for i in {1..12}; do
            RESOLVED=$(dig +short $DNS_RECORD @8.8.8.8 | head -1 || echo "")
            
            if [ -n "$RESOLVED" ]; then
              echo "✅ DNS propagated: $DNS_RECORD → $RESOLVED"
              exit 0
            fi
            
            echo "Attempt $i/12 - Waiting for DNS propagation..."
            sleep 10
          done
          
          echo "⚠️ DNS not fully propagated yet - may need more time"

  # ═══════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════════
  summary:
    name: "📋 Summary"
    runs-on: ubuntu-latest
    needs: [check-prerequisites, build-and-push, deploy, setup-dns]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🎉 together3 Deployed with Direct ELB + Route53
          
          ## Configuration
          | Field | Value |
          |-------|-------|
          | **App Name** | \`${{ env.APP_NAME }}\` |
          | **Tenant** | \`${{ env.TENANT }}\` |
          | **Region** | \`${{ env.AWS_REGION }}\` |
          | **Environment** | \`${{ env.ENVIRONMENT }}\` |
          | **Namespace** | \`${{ env.NAMESPACE }}\` |
          | **EKS Cluster** | \`${{ env.EKS_CLUSTER }}\` |
          | **Mode** | **Direct ELB** (Bypassing NGINX Ingress) |
          
          ## Container Image
          \`\`\`
          ${{ needs.build-and-push.outputs.full_image }}
          \`\`\`
          
          ## 🌐 Endpoints
          
          ### DNS Record (Route53)
          \`\`\`
          ${{ needs.setup-dns.outputs.dns_record }}
          \`\`\`
          
          **Access URL:**
          
          👉 [http://${{ needs.setup-dns.outputs.dns_record }}](http://${{ needs.setup-dns.outputs.dns_record }})
          
          ### Raw ELB Endpoint
          \`\`\`
          ${{ needs.deploy.outputs.elb_endpoint }}
          \`\`\`
          
          **Direct ELB Access:**
          
          👉 [http://${{ needs.deploy.outputs.elb_endpoint }}](http://${{ needs.deploy.outputs.elb_endpoint }})
          
          ## AWS Resources Created
          - ✅ ECR Repository: \`${{ env.TENANT }}/${{ env.APP_NAME }}\`
          - ✅ Kubernetes Namespace: \`${{ env.NAMESPACE }}\`
          - ✅ Deployment: \`${{ env.APP_NAME }}\`
          - ✅ LoadBalancer Service: \`${{ env.APP_NAME }}-elb\`
          - ✅ AWS Network Load Balancer: \`${{ env.TENANT }}-${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}-elb\`
          - ✅ Route53 DNS Record: \`${{ needs.setup-dns.outputs.dns_record }}\` → ELB
          
          ## Architecture
          \`\`\`
          ┌─────────────────────────────────────────────────────────────┐
          │                   DIRECT ELB ARCHITECTURE                   │
          ├─────────────────────────────────────────────────────────────┤
          │                                                             │
          │  User Request                                               │
          │       │                                                     │
          │       ▼                                                     │
          │  ┌───────────────────────────────────────┐                  │
          │  │  AWS NLB (Network Load Balancer)      │                  │
          │  │  opseratest-together3-dev-elb        │                  │
          │  │  Port: 80 → 8080                      │                  │
          │  └───────────────────────────────────────┘                  │
          │       │                                                     │
          │       ▼  (Direct connection - NO NGINX)                     │
          │  ┌───────────────────────────────────────┐                  │
          │  │  Pod: together3                       │                  │
          │  │  Container: nginx-unprivileged:8080   │                  │
          │  │  Replicas: 2                          │                  │
          │  └───────────────────────────────────────┘                  │
          │                                                             │
          └─────────────────────────────────────────────────────────────┘
          
          ❌ BYPASSED: NGINX Ingress Controller
          ❌ BYPASSED: Shared Load Balancer
          ✅ CREATED:  Dedicated NLB per application
          \`\`\`
          
          ## Cost Consideration
          ⚠️ **Note:** Each direct ELB costs ~\$16/month. The shared NGINX Ingress pattern 
          costs \$16/month total for unlimited apps. Use this pattern only when you need 
          dedicated load balancer features (e.g., NLB for TCP/UDP, specific performance requirements).
          
          ## Next Steps
          - Test the endpoint: \`curl http://${{ needs.deploy.outputs.elb_endpoint }}/\`
          - For HTTPS: Add AWS ACM certificate to the NLB
          - For custom domain: Create Route53 CNAME pointing to the ELB
          EOF
