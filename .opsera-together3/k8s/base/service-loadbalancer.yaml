# ═══════════════════════════════════════════════════════════════════════════════
# SERVICE - LoadBalancer Type (DIRECT ELB - Bypassing NGINX Ingress)
# App: together3 | Tenant: opseratest
# Generated by Opsera Code-to-Cloud Enterprise v1.7.3
# 
# This creates a DEDICATED AWS Network Load Balancer directly attached to pods
# Bypasses: NGINX Ingress Controller, shared load balancer
# Cost: ~$16/month per NLB (vs shared ingress which costs $16/month total)
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Service
metadata:
  name: together3-elb
  labels:
    app: together3
    tenant: opseratest
    lb-mode: direct
  annotations:
    # AWS Load Balancer Controller annotations
    service.beta.kubernetes.io/aws-load-balancer-name: "opseratest-together3-dev-elb"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "tenant=opseratest,app=together3,environment=dev,mode=direct-elb"
    # Health check configuration
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/healthz"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8080"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local  # Preserves client IP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: together3
