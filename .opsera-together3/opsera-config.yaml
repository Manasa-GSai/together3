# ═══════════════════════════════════════════════════════════════════════════════
# OPSERA CONFIG - Single Source of Truth (RULE 60)
# App: together3 | Tenant: opseratest | Region: us-east-1
# Mode: DIRECT ELB (Bypassing NGINX Ingress Controller)
# Generated by Opsera Code-to-Cloud Enterprise v1.7.3
# ═══════════════════════════════════════════════════════════════════════════════

# Application Configuration
app:
  name: together3
  type: frontend  # frontend | backend | fullstack
  framework: vite-react
  port: 8080

# Tenant Configuration (RULE 100)
tenant:
  name: opseratest
  # All resources use this prefix for isolation

# Cloud Configuration
cloud:
  provider: aws
  region: us-east-1
  region_short: use1

# Cluster Configuration (RULE 70-72)
clusters:
  hub:
    name: argocd-use1
    region: us-east-1
    purpose: argocd-control-plane
  spoke:
    name: opseratest-use1-np
    region: us-east-1
    purpose: workloads

# Load Balancer Configuration - DIRECT ELB MODE
load_balancer:
  mode: direct_elb  # direct_elb | nginx_ingress
  type: nlb  # nlb | clb | alb
  scheme: internet-facing
  # This bypasses NGINX Ingress and creates a dedicated ELB per application
  
# Domain Configuration (RULE 64)
dns:
  base_domain: agent.opsera.dev
  pattern: "{tenant}-{app}-{env}.{base_domain}"
  # Note: With direct ELB, DNS must point to the new ELB, not shared NGINX

# Environments
environments:
  dev:
    enabled: true
    namespace: opseratest-together3-dev
    hostname: opseratest-together3-dev.agent.opsera.dev
    deployment_strategy: rolling
    replicas: 2

# TLS Configuration - DISABLED (Direct ELB mode uses AWS ACM or HTTP)
tls:
  strategy: none  # Using HTTP for direct ELB, ACM can be added later
  # For HTTPS with direct ELB, use AWS ACM certificate on the NLB

# Container Registry (RULE 101)
registry:
  type: ecr
  # Pattern: {account_id}.dkr.ecr.{region}.amazonaws.com/{tenant}/{app}
  repository_pattern: "{tenant}/{app}"

# Authentication (RULE 68)
auth:
  aws_auth_method: access_keys  # access_keys | oidc
  # Secrets required: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GH_PAT

# Generated timestamp
metadata:
  version: "1.7.3"
  generated_at: "2026-01-30"
  skill: code-to-cloud-enterprise
  mode: direct-elb
